[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.0,<6.1)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "coverage (>=7.16.0,<8.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "eventlet (>=0.41.2,<0.42.0)",
